<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1> Registration Form </h1>
    <hr>
    <form>
        <label for="name"> name </label><br>
        <input type="text" id="name" name="name" placeholder="enter your name">
        <br><br>
        <label for=" last name"> last name </label><br>
        <input type="text" id="lname" name="lname" value="popal">
        <br>
        <br>
        <label for="email"> email</label><br>
        <input type="text" id="email" name="email" placeholder="enter your email">
        <br> <br>
        <p> select your gender: </p>
        <label for="gender"> male</label>
        <input type="radio" id="male" name="female">
        <label for="gender"> female </label>
        <input type="radio" id="female" name="female">
        <label for="gender"> other </label>
        <input type="radio" id="other" id="other" name="female">
        <br><br>
        <p> select your preferred services: </p>
        <label for="services"> web devalopment</label>
        <input type="checkbox" name="services" id="services" name="services">
        <br><br>
        <label for="services"> web design </label>
        <input type="checkbox" name="services" id="services">
        <br><br>
        <label for="services"> graphic design</label>
        <input type="checkbox" name=" services" id=" services">
        <br><br>
        <label for=" services"> services </label>
        <input type="checkbox" name="services" id=" services">
        <br><br>
        <label> upload your photo:</label>
        <input type="file" name="photo">
        <br><br>
        <label> date of birth</label>
        <input type="date" name="dob">
        <br><br>
        <label> select your experience level</label>
        <input type="range" name="experience" min="0" max="10">
        <br><br>
        <input type="submit" value="submit">
    </form>
    
</body>
</html>
